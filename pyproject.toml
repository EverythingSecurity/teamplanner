[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cis-planning-agent"
version = "0.1.0"
description = "CIS Planning Control Tower - Azure AI Foundry triage agent and deterministic workflow"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.17",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cis-planning = "cis_planning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cis_planning = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
